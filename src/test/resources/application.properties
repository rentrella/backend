spring.application.name=rentrella

# 테스트는 실제 MySQL 대신 인메모리 H2를 사용한다 (.env 불필요, CI에서도 그대로 동작)
spring.datasource.url=jdbc:h2:mem:rentrella;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=rentrella-test-secret-key-must-be-32-bytes-long
app.jwt.access-token-validity-ms=1800000
app.jwt.refresh-token-validity-ms=1209600000
app.auth.email-code-validity-minutes=3
app.auth.email-code-max-failed-attempts=5
