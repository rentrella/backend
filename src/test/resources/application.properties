spring.application.name=rentrella-test

spring.datasource.url=jdbc:h2:mem:rentrella-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.jwt.secret=rentrella-test-secret-key-must-be-32-bytes-long
app.jwt.access-token-validity-ms=1800000
app.jwt.refresh-token-validity-ms=1209600000
app.auth.email-code-validity-minutes=3
app.auth.email-code-max-failed-attempts=5
